<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 900" width="640" height="900" role="img" aria-label="Portrait placeholder">
  <defs>
    <linearGradient id="body" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#3a3a38" />
      <stop offset="0.55" stop-color="#232322" />
      <stop offset="1" stop-color="#161615" />
    </linearGradient>
    <linearGradient id="skin" x1="0.25" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#e6dcc9" />
      <stop offset="1" stop-color="#c3b7a1" />
    </linearGradient>
    <linearGradient id="hair" x1="0.3" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#2c2b28" />
      <stop offset="1" stop-color="#151513" />
    </linearGradient>
    <clipPath id="frame">
      <rect x="0" y="0" width="640" height="900" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- torso -->
    <path
      d="M320 372c108 0 176 62 200 150 22 82 34 190 38 378H82c4-188 16-296 38-378 24-88 92-150 200-150z"
      fill="url(#body)"
    />
    <!-- neck -->
    <path d="M266 300h108v104c0 30-24 46-54 46s-54-16-54-46z" fill="#b7a992" />
    <!-- head -->
    <ellipse cx="320" cy="212" rx="106" ry="126" fill="url(#skin)" />
    <!-- hair -->
    <path
      d="M320 74c68 0 112 42 116 108 2 30-4 52-10 62-4-38-14-56-30-64-24-12-64-2-104-14-18-6-28-18-32-30-14 16-20 60-16 108-10-14-18-38-16-68 4-64 44-102 92-102z"
      fill="url(#hair)"
    />
    <!-- collar -->
    <path d="M266 396c14 26 32 40 54 40s40-14 54-40l30 18c-18 44-48 66-84 66s-66-22-84-66z" fill="#141413" />
  </g>
</svg>
